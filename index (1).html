<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesa Points</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app">

  <header class="app-header">
    <span class="logo-mark">P</span>
    <span class="logo-text">Pesa Points</span>
    <button id="logout-btn" class="logout-btn hidden">Log out</button>
  </header>

  <div id="banner" class="banner hidden"></div>

  <!-- LOGIN / SIGNUP -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card">
      <p class="auth-title">Welcome</p>
      <p class="auth-sub" id="auth-sub">Log in to manage your balance.</p>

      <form id="auth-form" class="form">
        <label class="field">
          <span class="field-label">Email</span>
          <input type="email" name="email" required placeholder="you@example.com">
        </label>
        <label class="field">
          <span class="field-label">Password</span>
          <input type="password" name="password" required placeholder="&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;&#8226;" minlength="6">
        </label>
        <button type="submit" class="primary-btn" id="auth-submit">Log in</button>
      </form>

      <button class="link-btn auth-switch" id="auth-switch">Need an account? Sign up</button>
    </div>
  </div>

  <main class="screen-area hidden" id="main-area">

    <!-- BALANCE -->
    <section class="screen" id="screen-balance">
      <div class="balance-card">
        <p class="balance-label">Available balance</p>
        <p class="balance-amount"><span id="balance-value">&mdash;</span></p>
        <p class="balance-currency">KES</p>
      </div>

      <div class="quick-actions">
        <button class="quick-btn" data-nav="deposit">
          <span class="quick-icon">&#8595;</span>
          Deposit
        </button>
        <button class="quick-btn" data-nav="withdraw">
          <span class="quick-icon">&#8593;</span>
          Withdraw
        </button>
      </div>

      <div class="panel">
        <div class="panel-header">
          <h2>Recent deposits</h2>
          <button class="link-btn" data-nav="history">See all</button>
        </div>
        <ul class="mini-list" id="recent-deposits">
          <li class="empty-row">Loading&hellip;</li>
        </ul>
      </div>
    </section>

    <!-- DEPOSIT -->
    <section class="screen hidden" id="screen-deposit">
      <h1 class="screen-title">Deposit</h1>
      <p class="screen-sub">Upload your payment receipt and we'll verify it.</p>

      <form id="deposit-form" class="form">
        <label class="field">
          <span class="field-label">Amount (KES)</span>
          <input type="number" name="amount" min="1" step="1" required placeholder="1000">
        </label>

        <label class="field">
          <span class="field-label">Receipt</span>
          <div class="file-drop" id="file-drop">
            <span id="file-drop-text">Choose an image or PDF</span>
            <input type="file" name="receipt" id="receipt-input" accept="image/jpeg,image/png,image/webp,application/pdf" required>
          </div>
        </label>

        <button type="submit" class="primary-btn" id="deposit-submit">Submit deposit</button>
      </form>
    </section>

    <!-- WITHDRAW -->
    <section class="screen hidden" id="screen-withdraw">
      <h1 class="screen-title">Withdraw</h1>
      <p class="screen-sub">Minimum withdrawal is KES 100.</p>

      <div class="method-toggle">
        <button class="method-btn active" data-method="mpesa">M-Pesa</button>
        <button class="method-btn" data-method="bank">Bank transfer</button>
      </div>

      <form id="withdraw-form" class="form">
        <input type="hidden" name="method" id="withdraw-method" value="mpesa">

        <label class="field">
          <span class="field-label">Amount (KES)</span>
          <input type="number" name="amount" min="100" step="1" required placeholder="500">
        </label>

        <div id="mpesa-fields">
          <label class="field">
            <span class="field-label">M-Pesa phone number</span>
            <input type="tel" name="phone" placeholder="07XXXXXXXX">
          </label>
        </div>

        <div id="bank-fields" class="hidden">
          <label class="field">
            <span class="field-label">Bank name</span>
            <input type="text" name="bank" placeholder="e.g. Equity Bank">
          </label>
          <label class="field">
            <span class="field-label">Account number</span>
            <input type="text" name="accountNumber" placeholder="0000000000">
          </label>
          <label class="field">
            <span class="field-label">Account holder name</span>
            <input type="text" name="accountName" placeholder="Full name">
          </label>
        </div>

        <button type="submit" class="primary-btn" id="withdraw-submit">Request withdrawal</button>
      </form>
    </section>

    <!-- HISTORY -->
    <section class="screen hidden" id="screen-history">
      <h1 class="screen-title">History</h1>

      <div class="history-toggle">
        <button class="history-tab active" data-tab="deposits">Deposits</button>
        <button class="history-tab" data-tab="withdrawals">Withdrawals</button>
      </div>

      <ul class="full-list" id="history-list">
        <li class="empty-row">Loading&hellip;</li>
      </ul>
    </section>

  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-nav="balance">
      <span class="nav-icon">&#9679;</span>
      Balance
    </button>
    <button class="nav-btn" data-nav="deposit">
      <span class="nav-icon">&#8595;</span>
      Deposit
    </button>
    <button class="nav-btn" data-nav="withdraw">
      <span class="nav-icon">&#8593;</span>
      Withdraw
    </button>
    <button class="nav-btn" data-nav="history">
      <span class="nav-icon">&#8801;</span>
      History
    </button>
  </nav>

</div>

<script>
/* =========================================================

<script src="app.js"></script>
</body>
</html>
